<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mind map</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <svg id="map"></svg>
  <div id="sheet" hidden>
    <button id="sheet-backdrop" type="button" aria-label="Chiudi"></button>
    <div id="sheet-card" role="dialog" aria-modal="true">
      <div id="sheet-bar">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" type="button">Chiudi</button>
      </div>
      <div id="sheet-scroll">
        <div id="sheet-body"></div>
        <div id="sheet-visuals"></div>
      </div>
    </div>
  </div>
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/markmap-view.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
  <script src="vendor/math.min.js"></script>
  <script src="vendor/plotly-gl3d.min.js"></script>
  <script src="plot.js"></script>
  <script src="map.js"></script>
</body>
</html>
