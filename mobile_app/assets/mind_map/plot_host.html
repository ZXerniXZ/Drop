<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Grafico</title>
  <link rel="stylesheet" href="map.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--panel);
    }
    #host {
      height: 100%;
      box-sizing: border-box;
      padding: 8px 8px 0;
    }
    #host figure {
      margin: 0;
    }
    #host figcaption {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    #host .plot {
      width: 100%;
      height: 188px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="host"></div>
  <script src="vendor/math.min.js"></script>
  <script src="vendor/plotly-gl3d.min.js"></script>
  <script src="plot.js"></script>
  <script>
    function post(message) {
      const raw = JSON.stringify(message);
      if (window.DropBridge && typeof window.DropBridge.postMessage === 'function') {
        window.DropBridge.postMessage(raw);
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(raw, '*');
      }
    }

    window.DropPlotHost = {
      render: function (visual, isDark) {
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        const host = document.getElementById('host');
        if (window.DropPlot) window.DropPlot.purge(host);
        host.innerHTML = '';
        if (!visual || !window.DropPlot) return;
        window.DropPlot.render(host, visual, { compact: true });
        requestAnimationFrame(function () {
          window.DropPlot.resize(host);
        });
      },
    };

    window.addEventListener('message', function (event) {
      let data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (error) { return; }
      }
      if (!data || data.type !== 'render') return;
      window.DropPlotHost.render(data.visual, data.dark);
    });

    window.addEventListener('resize', function () {
      if (window.DropPlot) window.DropPlot.resize(document.getElementById('host'));
    });

    post({ type: 'ready' });
  </script>
</body>
</html>
