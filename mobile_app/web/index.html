<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Drop registra, trascrive e riassume le tue note vocali.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drop">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Drop</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #09090B;
      color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #flutter-host {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9998;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #09090B;
    }
    #loading img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
    }
    #loading p {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.3px;
      font-weight: 600;
    }
    #boot-status {
      font-size: 13px;
      font-weight: 400;
      color: rgba(244,244,245,0.45);
    }
    #sw-update {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #0C0C0E;
      color: #F4F4F5;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    #sw-update[hidden] { display: none; }
    #sw-update button {
      border: 1px solid rgba(255,255,255,0.16);
      background: #F4F4F5;
      color: #09090B;
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="flutter-host"></div>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <p>Drop</p>
    <p id="boot-status"></p>
  </div>
  <div id="sw-update" hidden>
    <span>Nuova versione disponibile</span>
    <button type="button" id="sw-reload">Ricarica</button>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
